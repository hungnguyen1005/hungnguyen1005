name: Generate All Commit Games

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Snake ──────────────────────────────────────────────────────────────
      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: hungnguyen1005
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # ── Pac-Man + Bomberman ────────────────────────────────────────────────
      - name: Generate Pac-Man SVG
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: hungnguyen1005
          games: "pacman"

      - name: Generate Bomberman SVG
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: hungnguyen1005
          games: "bomberman"

      # ── Push ALL files to output branch ───────────────────────────────────
      - name: Push all game SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
