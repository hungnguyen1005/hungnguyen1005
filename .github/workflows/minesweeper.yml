name: Generate Minesweeper Contribution Graph

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Minesweeper contribution graph SVG
        uses: Xiang511/GitHub-Contribution-Minesweeper@main
        with:
          github_user_name: hungnguyen1005
          github_token: ${{ secrets.GITHUB_TOKEN }}
          output_path: dist/minesweeper.svg

      - name: Push SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
